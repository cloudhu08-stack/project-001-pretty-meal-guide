v><div class="pm-food-copy"><span class="pm-section-index">05 FOOD VISUAL</span><h2>先看风格，不提前看完整菜序</h2><p>图片帮助建立料理与空间的第一印象。完整用餐流程仍以菜单文字为主。</p></div></section>`:'';const noCurrent=`<div class="pm-no-current"><h3>当前完整菜单尚未公开</h3><p>${id==='sushi-oyama'?'主厨发办会随当日食材变化。页面没有用不同日期的食客记录拼出一份看似当前的固定菜单。':'目前没有足够可靠的公开资料确认当季完整菜单。带日期的近期记录已放在页面后部，方便参考而不会被误认为实时菜单。'}</p></div>`;app.innerHTML=`<section class="pm-detail"><button class="pm-back" id="back" type="button"><b aria-hidden="true">←</b> 返回上海餐厅</button><section class="pm-hero"><figure class="pm-hero-media"><img src="${esc(ui.hero.url)}" alt="${esc(ui.hero.alt)}" fetchpriority="high"></figure><div class="pm-hero-copy"><div class="pm-location">${esc(d.address.city)} · ${esc(d.address.district)}</div><h1>${esc(ui.name||d.display_name)}</h1><p class="pm-english">${esc(ui.english||r.restaurant.name)}</p><p class="pm-style">${esc(ui.style)}</p>${ui.heroPrice?`<p class="pm-hero-price">${esc(ui.heroPrice)}</p>`:''}<div class="pm-hero-actions">${bookingButton}<a class="pm-menu-jump" href="#restaurant=${esc(id)}&section=menu">查看菜单 ↓</a></div></div></section><section class="pm-section"><div class="pm-identity"><div><span class="pm-section-index">02 QUICK DECISION</span><h2 class="pm-identity-name">${esc(ui.name)}</h2><p class="pm-identity-en">${esc(ui.english)}</p><p class="pm-identity-style">${esc(ui.style)}</p><p class="pm-identity-summary">${esc(ui.summary)}</p></div><div class="pm-decision"><div class="pm-decision-item"><span class="pm-decision-label">价格</span><p class="pm-decision-value">${esc(ui.decisionPrice)}</p><p class="pm-decision-note">${esc(ui.decisionPriceNote)}</p></div><div class="pm-decision-item"><span class="pm-decision-label">用餐方式</span><p class="pm-decision-value">${esc(menuTypes)}</p></div><div class="pm-decision-item"><span class="pm-decision-label">区域</span><p class="pm-decision-value">${esc(d.address.city)} · ${esc(d.address.district)}</p></div><div class="pm-decision-item"><span class="pm-decision-label">预约</span><p class="pm-decision-value">${esc(booking?booking.label.replace(' ↗',''):'预约渠道待确认')}</p><p class="pm-decision-note">${esc(booking?booking.note:'暂未找到足够可靠的直达预约渠道')}</p></div></div></div></section>${detailVisualStory(ui)}<section class="pm-section" id="menu"><div class="pm-menu-intro"><div><span class="pm-section-index">04 MENU</span><h2>当前菜单与价格</h2></div><p>先看当前可靠信息。不同吃法分开呈现，单点价格不会被当作套餐价格。</p></div>${primary.length?primary.map(m=>detailMenu(ui,m)).join(''):noCurrent}</section>${foodBlock}${additional.length?`<section class="pm-section"><div class="pm-section-head"><div><span class="pm-section-index">06 MORE WAYS TO DINE</span><h2>其他用餐方式</h2></div><p>每份菜单独立呈现，不把午餐、品鉴、单点或多人套餐混在一起。</p></div><div class="pm-additional-list">${additional.map(m=>detailMenu(ui,m)).join('')}</div></section>`:''}<section class="pm-section"><div class="pm-booking"><div><span class="pm-section-index">07 RESERVATION</span><h2>${booking?'准备好就去预约':'预约渠道待确认'}</h2><p>${booking?`${esc(booking.note)}。漂亮饭指南不会显示或承诺实时座位，最终安排以餐厅渠道为准。`:'目前没有足够可靠的直达预约方式，请先通过餐厅公开渠道核实。'}</p></div>${bookingButton}</div></section><section class="pm-section"><div class="pm-section-head"><div><span class="pm-section-index">08 VISIT</span><h2>到店信息</h2></div><p>只展示能够回溯来源的基础信息。</p></div><div class="pm-access"><article class="pm-access-item"><b>地址</b><p>${esc(detailClean(d.address.full))}</p></article>${hours.length?`<article class="pm-access-item"><b>营业时间</b><p>${hours.map(esc).join('<br>')}</p></article>`:''}${dress?`<article class="pm-access-item"><b>着装建议</b><p>${esc(detailClean(dress))}</p></article>`:''}${booking?`<article class="pm-access-item"><b>预约方式</b><p>${esc(booking.note)}</p></article>`:''}</div></section>${historical.length||other.length?`<section class="pm-section pm-history"><div class="pm-section-head"><div><span class="pm-section-index">09 ARCHIVE</span><h2>历史菜单参考</h2></div><p>这些内容保留原记录时间，不代表今天仍然供应或维持相同价格。</p></div><details><summary>展开带日期的历史菜单</summary><div>${[...historical,...other].map(m=>detailMenu(ui,m)).join('')}</div></details></section>`:''}<section class="pm-section pm-sources"><span class="pm-section-index">10 SOURCES</span><h2>来源与更新记录</h2><p>菜单、价格、营业时间与预约政策可能调整，请以餐厅最新官方信息为准。</p><details><summary>查看信息来源</summary><ul class="pm-source-list">${sourceMarkup}</ul></details></section></section>`;document.querySelector('#back').onclick=()=>location.hash=''}
async function start(){
  const loadDataset=async url=>{
    const controller=new AbortController();
    const timer=window.setTimeout(()=>controller.abort(),6000);
    try{const response=await fetch(url,{cache:'no-store',signal:controller.signal});if(!response.ok)throw Error(`HTTP ${response.status}`);return await response.json()}finally{window.clearTimeout(timer)}
  };
  try{
    dataset=await loadDataset('/data/production-dataset.json').catch(()=>loadDataset('./data/production-dataset.json'));
    const go=()=>{
      detailMotionCleanup();
      try{
        const x=location.hash.match(/restaurant=([^&]+)/);
        if(x){
          document.title=x[1]==='da-vittorio'?'Da Vittorio 上海 · 漂亮饭指南':'漂亮饭指南 · 餐厅详情';
          if(x[1]==='da-vittorio')daVittorioDetail(x[1]);else{detail(x[1]);prepareDetailMotion(detailPresentation[x[1]])}
        }else{
          document.title='漂亮饭指南 · 上海 Fine Dining';
          home();
        }
      }catch(error){
        console.error('Restaurant route failed',error);
        document.title='暂时无法加载餐厅 · 漂亮饭指南';
        app.innerHTML='<div class="empty"><h2>餐厅页面暂时无法打开</h2><p>请返回餐厅列表后重试。</p><button class="back" type="button" id="route-back">返回上海餐厅</button></div>';
        document.querySelector('#route-back').onclick=()=>location.hash='';
      }
    };
    go();
    window.onhashchange=event=>{const previous=new URL(event.oldURL).hash,current=new URL(event.newURL).hash;const restaurant=hash=>hash.match(/restaurant=([^&]+)/)?.[1];if(restaurant(previous)&&restaurant(previous)===restaurant(current)){if(current.includes("section=menu"))document.querySelector("#menu")?.scrollIntoView();else window.scrollTo(0,0);return}go();if(current.includes("section=menu"))document.querySelector("#menu")?.scrollIntoView();else window.scrollTo(0,0)};
    if(location.hash.includes("section=menu"))document.querySelector("#menu")?.scrollIntoView();
  }catch{
    app.innerHTML='<div class="empty"><h2>数据暂时无法读取</h2><p>请刷新页面；若问题仍然存在，请重新打开本地预览。</p></div>';
  }
}start();

/* V1.1 keeps the frozen homepage composition and only adds Da Vittorio's reservation shortcut. */

  const cards=selected.map(({d,ui},index)=>{
    const visual=ui.visual;
    const content=`<figure class="home-visual" data-source="${esc(visual.source||'placeholder')}"><img src="${esc(visual.url)}" alt="${esc(ui.cn)} 餐厅视觉" ${index<2?'fetchpriority="high"':'loading="lazy"'} onerror="this.closest('.home-visual').classList.add('image-unavailable')"><span class="visual-fallback" aria-hidden="true">${esc(visual.fallback)}</span></figure><div class="home-card-copy"><div class="home-location">${esc(d.address.city)} · ${esc(d.address.district)}</div><h2>${esc(ui.cn)}</h2>${ui.en?`<p class="home-english">${esc(ui.en)}</p>`:''}${ui.honor?`<p class="home-honor" title="荣誉来源：${esc(ui.honorSource)}">${esc(ui.honor)}</p>`:''}<p class="home-summary">${esc(ui.summary)}</p><div class="home-price"><strong>${esc(ui.price)}</strong><span>${esc(ui.priceNote)}</span>${ui.caution?`<small>${esc(ui.caution)}</small>`:''}</div><span class="home-cta">查看餐厅 <b aria-hidden="true">→</b></span></div>`;
    if(d.id==='da-vittorio'&&d.access?.reservation?.url)return `<article class="home-card home-card-with-reservation"><a class="home-card-main" href="#restaurant=${esc(d.id)}">${content}</a><a class="home-da-reserve" href="${esc(d.access.reservation.url)}" target="_blank" rel="noreferrer">查看实时预约 ↗</a></article>`;
    return `<a class="home-card" href="#restaurant=${esc(d.id)}">${content}</a>`;
  }).join('');
  app.innerHTML=`<div class="home"><section class="home-hero"><div><div class="home-kicker">漂亮饭指南</div><h1>发现你身边的 Fine Dining</h1><p>看懂菜单、价格和预约信息，再决定今晚去哪吃。</p></div><label class="home-city-control"><span>当前城市</span><select id="city" aria-label="当前城市"><option>上海</option></select><b aria-hidden="true">⌄</b></label></section><section class="home-results"><div class="home-results-heading"><h2>上海餐厅</h2><p>从菜单开始挑选今晚这一餐</p></div><div class="home-grid">${cards||'<div class="home-empty">暂时没有符合条件的餐厅。</div>'}</div></section><details class="home-filters"><summary>筛选餐厅</summary><div class="home-filter-content"><div class="filter-row"><span>菜系</span><div class="filter-options" role="group" aria-label="菜系">${cuisines.map(x=>`<button class="filter-button ${x===activeCuisine?'is-active':''}" type="button" data-cuisine="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><div class="filter-row"><span>用餐方式</span><div class="filter-options" role="group" aria-label="用餐方式">${meals.map(x=>`<button class="filter-button ${x===activeMeal?'is-active':''}" type="button" data-meal="${esc(x)}">${esc(x)}</button>`).join('')}</div></div></div></details></div>`;
  document.querySelectorAll('[data-cuisine]').forEach(x=>x.onclick=()=>{activeCuisine=x.dataset.cuisine;home()});
  document.querySelectorAll('[data-meal]').forEach(x=>x.onclick=()=>{activeMeal=x.dataset.meal;home()});
}
const daTastingDetails={
  'da-vittorio-sea-tasting':{title:'每日市场鱼鲜与贝类',copy:'官方菜单说明，这是一套以每日市场优质鱼鲜与贝类为主的 7 道品鉴套餐，并包含招牌 Paccheri alla Vittorio。部分菜品可能根据季节及当日食材调整。'},
  'da-vittorio-without-borders-tasting':{title:'主厨的自由创作',copy:'官方菜单将这套 12 道品鉴套餐描述为主厨不受拘束的创意表达。具体菜序会随季节及市场供应调整。'}

const daV11MenuNames={'da-vittorio-sea-tasting':['Da Vittorio 海之味','The Sea of Da Vittorio','当前官网列出 · 7 道品鉴套餐'],'da-vittorio-without-borders-tasting':['无界','Without Borders','当前官网列出 · 12 道品鉴套餐'],'da-vittorio-a-la-carte':['单点菜单','À la carte','当前官网列出 · 按菜品单独点选']};

  const pairings=(menu.pairings||[]).map((p,i)=>`<div class="da-pairing"><span>${esc(daPairingName(p,i))}</span><b>${esc(price(p.price))}</b><small>每位</small></div>`).join('');
  const foodPrice=menu.price?.amount!=null?price(menu.price):'';
  const head=`<header class="da-menu-head"><div><h3 class="da-menu-name">${esc(names[0])}${names[1]?`<span>${esc(names[1])}</span>`:''}</h3></div>${foodPrice?`<div class="da-menu-price">${esc(foodPrice)}<small>每位，另收 10% 服务费</small></div>`:''}</header><div class="da-menu-facts"><span class="da-fact">${esc(names[2])}</span><span class="da-fact">官方菜单链接核查于 2026年10月5日</span></div>`;

  const groups={};(menu.menu_items||[]).forEach(x=>{const key=x.section||'UNKNOWN';(groups[key]??=[]).push(x)});
  return `<article class="da-menu-record ${index===0?'is-active':''}" data-menu="${esc(menu.id)}">${head}<div class="da-a-la-carte"><div class="da-menu-groups">${Object.entries(groups).map(([section,items])=>`<section class="da-menu-group"><h3>${esc(daSectionNames[section]||section)}</h3><p class="da-menu-group-note">${section==='TO SHARE'?'适合共享，人数以菜单原文为准':'按菜品单独点选'}</p>${items.map(daDish).join('')}</section>`).join('')}</div><aside class="da-menu-aside"><p>把鼠标悬停在带有料理视觉的菜名上，或点击菜名查看。</p><b>菜单是今晚的起点</b><p class="da-preview-hint">图片不会自动展开，避免在出发前提前剧透整顿饭。</p></aside></div><p class="da-menu-note">单点菜单会随季节与市场供应调整。仅展示官方菜单中明确标出的单道价格；未列明的价格保留为待餐厅确认。所有餐食价格另收 10% 服务费。</p></article>`;
}
function applyDaVittorioV11(){
  if(!document.querySelector('.da-detail'))return;
  document.querySelectorAll('.da-quick-link,.da-booking .da-primary-cta').forEach(x=>x.textContent='查看实时可预约时间 ↗');
  const bookingText=document.querySelector('.da-booking p');if(bookingText)bookingText.textContent='前往 Da Vittorio 官方预约渠道。该页面不显示实时座位或即时确认。';
  const sourceText=document.querySelector('.da-sources>p');if(sourceText)sourceText.textContent='官方菜单链接核查于 2026年10月5日。官方菜单未标注菜单发布日期；菜单、价格、营业时间与预约政策可能发生调整，请以餐厅最新官方信息为准。';
}
const daPageObserver=new MutationObserver(applyDaVittorioV11);daPageObserver.observe(app,{childList:true,subtree:true});
document.addEventListener('click',event=>{const button=event.target.closest('[data-menu-tab]');if(!button)return;const target=button.dataset.menuTab;document.querySelectorAll('[data-menu-tab]').forEach(x=>x.classList.toggle('is-active',x===button));document.querySelectorAll('.da-menu-record').forEach(x=>x.classList.toggle('is-active',x.dataset.menu===target));});
